specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Tattle
providerId: tattle
created: '2026-06-03'
modified: '2026-06-03'
reconciled: true
tags:
  - Restaurant
  - Guest Feedback
  - Customer Experience
  - Subscription
  - Per Location
description: >-
  Tattle prices its Customer Experience Improvement platform on a per-location,
  per-month subscription basis with volume discounts tiered by the number of
  units (locations) under management. All tiers include the same feature set —
  unlimited surveys, real-time analytics, AI-powered insights, the guest
  recovery system, multi-location management, 35+ integrations, enterprise
  security, dedicated support, and API access — with the per-location price
  decreasing as location count grows. Operators with 201+ units receive custom
  enterprise pricing arranged with the Tattle team. Billing is monthly and
  plans can be adjusted as location count changes. A reputation management
  module is available as a separate add-on.
sources:
  - https://get.tattleapp.com/pricing/
  - https://get.tattleapp.com/
plans:
