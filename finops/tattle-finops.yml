principles:
  - name: Visibility
    description: >-
      Consumption is observed through the Tattle dashboard, where per-location
      activity, survey volume, analytics, and AI Coach action plans surface;
      there is no public usage/billing API, so cost visibility is dashboard- and
      invoice-driven.
  - name: Allocation
    description: >-
      Spend is naturally allocated by location, since billing is per location
      per month — multi-location operators can attribute cost directly to each
      unit and roll up by brand or region within multi-location management.
  - name: Optimization
    description: >-
      The primary cost lever is location count: the per-location rate steps down
      across volume tiers ($125 → $100 → $85 → $65) as units grow, with custom
      pricing above 200 locations. Operators optimize by consolidating under one
      account to reach lower tiers and by adding the reputation module only where
      needed.
  - name: Accountability
    description: >-
      Account owners and finance contacts manage the subscription tier and
      add-ons directly with Tattle's customer success team
      (customersuccess@gettattle.com); plan changes track location growth so
      spend stays aligned to the active footprint.
