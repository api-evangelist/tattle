aid: tattle
name: Tattle
description: >-
  Tattle is an AI-powered Customer Experience Improvement (CXI) platform built
  for hospitality, trusted by 250+ restaurant brands including MOD Pizza,
  Hooters, and The Halal Guys. It collects real-time guest feedback at the point
  of transaction across ordering channels, then turns it into actionable
  insights with smart analytics, an AI Coach that generates action plans for
  operators, guest-recovery tools, cross-platform review management, and
  item-level menu performance tracking. Tattle markets an open, REST-based API
  and integrates with 35+ restaurant technology platforms such as Olo, Toast,
  PAR Brink, Square, Punchh, and Paytronix. Public, self-service API
  documentation is not published; the open API and custom integrations are
  arranged through Tattle's team.
type: Index
