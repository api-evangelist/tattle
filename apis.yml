    name: Tattle Open API
    description: >-
      Tattle describes an open, REST-based API and an API-first design enabling
      two-way data synchronization with restaurant POS, online ordering,
      loyalty, and kiosk systems so brands can incorporate Tattle into their
      tech stack. The company also builds custom integrations on request. No
      public API reference, base URL, or authentication documentation is
      published; access is coordinated through Tattle's integrations team.
