aid: tattle
name: Tattle
description: >-
  Tattle is an AI-powered Customer Experience Improvement (CXI) platform built
  for hospitality, supporting 220+ restaurant and hospitality brands across
  11,000+ locations globally — including Chili's, MOD Pizza, Hooters, Freddy's,
  Mellow Mushroom, and The Halal Guys. It collects real-time guest feedback at
  the point of transaction across ordering channels, then turns it into
  actionable insights with smart analytics, an AI Coach that delivers each
  general manager monthly action plans tied to their own guest feedback and SOPs,
  guest-recovery tools, cross-platform review management, and item-level menu
  performance tracking. Pricing is per location per month, starting at
  $59/location. Tattle markets an open, REST-based, API-first design and
  integrates with 34+ restaurant technology platforms across POS, online
  ordering, loyalty/CRM, and kiosk categories — such as Olo, Toast, PAR Brink,
  Square, Punchh, Paytronix, Revel, Thanx, and Checkmate. Public, self-service
  API reference documentation is not published; the open API and custom
  integrations are coordinated through Tattle's integrations team
  (customersuccess@gettattle.com).
